# Whisper model to use. See the README file for available options.
whisper_model=small.en

# Whisper device; GPU or CPU.
whisper_device=GPU

# Theme used for the WhisperAttack UI.
# Values: "default" (uses the default theme set for Windows), "light" or "dark"
theme=default

# IP address and port for the server to listen on for incoming commands.
# Defaults to 127.0.0.1:7798
#whisperattack_host=127.0.0.1
#whisperattack_port=7798

# IP address and port to send transcribed text commands to VoiceAttack.
# Defaults to 127.0.0.1:7799
#voiceattack_host=127.0.0.1
#voiceattack_port=7799
